name: Release

# Compiles the position-independent C stub to a flat shellcode blob and publishes
# it to a GitHub Release. C2's "Native Binder" downloads this and patches the URL +
# original-OEP RVA into it at bind time.
#
#   - push to main / manual  -> (re)creates the rolling `preview` release
#   - push of a v* tag        -> creates a versioned release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # gh release create / delete

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (x86_64)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build stub (freestanding, position-independent, both entry modes)
        # build.sh is the single source of truth: compile + relocation check +
        # link + marker-count gate. It prints the gcc version for reproducibility.
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: stub-x64
          path: dist/stub-x64-*.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stub-x64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --title "$TAG" --notes "Native loader stub $TAG" --repo "$GITHUB_REPOSITORY"
          else
            # Rolling preview: the delete-then-create pair briefly 404s the asset.
            # Acceptable for a rolling pre-release channel.
            gh release delete preview --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create preview dist/* --title "Preview" --prerelease --target "$GITHUB_SHA" \
              --notes "Rolling build of the native loader stub ($GITHUB_SHA)." --repo "$GITHUB_REPOSITORY"
          fi
